name: Build Kalokagatia APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Unpack project
        run: |
          mkdir extracted
          unzip lona.zip -d extracted
          find extracted -name pubspec.yaml -print

      - name: Prepare and build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name pubspec.yaml | head -n 1)")
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
                    flutter create . --platforms=android,ios --org com.kalokagatia --no-pub
          sed -i 's/timezone: \^0.10.1/timezone: ^0.11.2/' pubspec.yaml
          flutter pub get
                    python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/main.dart")
          code = path.read_text(encoding="utf-8")

          code = code.replace(
              "await plugin.initialize(init);",
              "await plugin.initialize(settings: init);",
          )

          code = code.replace(
              "await plugin.zonedSchedule(r.$1,r.$2,r.$3,at,details,androidScheduleMode:",
              "await plugin.zonedSchedule(id:r.$1,title:r.$2,body:r.$3,scheduledDate:at,notificationDetails:details,androidScheduleMode:",
          )

          code = code.replace(
              ":const SizedBox();})])))]);}",
              ":const SizedBox();})]))))]);}",
          )
          path.write_text(code, encoding="utf-8")

          PY
                    sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n' >> android/app/build.gradle.kts

          flutter build apk --release

       


      - name: Collect APK
        run: |
          APK=$(find extracted -path "*/build/app/outputs/flutter-apk/app-release.apk" | head -n 1)
          cp "$APK" kalokagatia-30-days.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kalokagatia-30-days
          path: kalokagatia-30-days.apk
          retention-days: 30
