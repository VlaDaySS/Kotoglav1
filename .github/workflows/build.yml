name: Build Kalokagatia APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Unpack project
        run: |
          mkdir extracted
          unzip lona.zip -d extracted
          find extracted -name pubspec.yaml -print

      - name: Prepare and build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name pubspec.yaml | head -n 1)")
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          flutter create . --platforms=android,ios --org com.kalokagatia
          flutter pub add timezone:^0.11.2
          flutter pub get
          flutter build apk --release


      - name: Collect APK
        run: |
          APK=$(find extracted -path "*/build/app/outputs/flutter-apk/app-release.apk" | head -n 1)
          cp "$APK" kalokagatia-30-days.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kalokagatia-30-days
          path: kalokagatia-30-days.apk
          retention-days: 30
